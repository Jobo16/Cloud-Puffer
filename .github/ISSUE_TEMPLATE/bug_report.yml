name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the relevant environment and steps. Remove personal data and secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Remove tokens, emails, and private message content.
