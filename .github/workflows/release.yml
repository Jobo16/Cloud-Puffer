name: Release production
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-puffer-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Promote staged image
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes deploy/compose.yml deploy/deploy.sh deploy@119.28.238.248:/opt/cloud-puffer/
          staged=$(ssh -o StrictHostKeyChecking=yes deploy@119.28.238.248 'cat /opt/cloud-puffer/staging/.release')
          staged_commit=$(printf '%s\n' "$staged" | sed -n 's/^COMMIT=//p')
          image_ref=$(printf '%s\n' "$staged" | sed -n 's/^IMAGE_REF=//p')
          test "$staged_commit" = "$GITHUB_SHA"
          printf '%s\n' "$GH_TOKEN" | ssh -o StrictHostKeyChecking=yes deploy@119.28.238.248 \
            "bash /opt/cloud-puffer/deploy.sh production $image_ref $GITHUB_SHA"
