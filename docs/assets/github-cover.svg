<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Puffer connects channels and agents</title>
  <desc id="desc">Channels on the left connect through Cloud Puffer to agent runtimes on the right. Labels distinguish available, preview, and planned connections.</desc>
  <rect width="1200" height="460" fill="#f4f8f6"/>

  <text x="72" y="71" fill="#3b6758" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CHANNELS</text>
  <text x="888" y="71" fill="#315976" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">AGENTS</text>

  <path d="M312 137h58m-58 76h58m-58 76h58m-58 76h58m0-228v228m0-114h58" fill="none" stroke="#8fb6a6" stroke-width="3" stroke-linecap="round"/>
  <path d="M772 251h58m0-114v228m0-228h58m-58 76h58m-58 76h58m-58 76h58" fill="none" stroke="#8fb6a6" stroke-width="3" stroke-linecap="round"/>

  <rect x="72" y="110" width="240" height="54" rx="16" fill="#dcece5"/>
  <rect x="72" y="186" width="240" height="54" rx="16" fill="#dcece5"/>
  <rect x="72" y="262" width="240" height="54" rx="16" fill="#e1eaf1"/>
  <rect x="72" y="338" width="240" height="54" rx="16" fill="#ffffff" stroke="#b5c9c0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="94" y="145" fill="#21493b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Web</text>
  <text x="94" y="221" fill="#21493b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">WeChat</text>
  <text x="94" y="297" fill="#315976" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">QQ</text>
  <text x="94" y="373" fill="#3d5d53" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Telegram · WhatsApp</text>

  <rect x="428" y="132" width="344" height="238" rx="28" fill="#285847"/>
  <text x="600" y="222" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Cloud Puffer</text>
  <text x="600" y="264" text-anchor="middle" fill="#e5f1eb" font-family="Arial, Helvetica, sans-serif" font-size="19">One account · One conversation</text>
  <path d="M493 285h214" stroke="#8fb6a6" stroke-width="2"/>
  <text x="600" y="317" text-anchor="middle" fill="#e5f1eb" font-family="Arial, Helvetica, sans-serif" font-size="17">Identity · Routing · Delivery</text>

  <rect x="888" y="110" width="240" height="54" rx="16" fill="#dcece5"/>
  <rect x="888" y="186" width="240" height="54" rx="16" fill="#e1eaf1"/>
  <rect x="888" y="262" width="240" height="54" rx="16" fill="#e1eaf1"/>
  <rect x="888" y="338" width="240" height="54" rx="16" fill="#ffffff" stroke="#b5c9c0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="910" y="145" fill="#21493b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Cloud runtime</text>
  <text x="910" y="221" fill="#315976" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Codex</text>
  <text x="910" y="297" fill="#315976" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">OpenClaw</text>
  <text x="910" y="373" fill="#3d5d53" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">More agents · …</text>

  <circle cx="76" cy="430" r="7" fill="#dcece5" stroke="#9cbcac"/>
  <text x="90" y="436" fill="#3d5d53" font-family="Arial, Helvetica, sans-serif" font-size="16">Available</text>
  <circle cx="205" cy="430" r="7" fill="#e1eaf1" stroke="#a5b9c9"/>
  <text x="219" y="436" fill="#3d5d53" font-family="Arial, Helvetica, sans-serif" font-size="16">Development preview</text>
  <circle cx="428" cy="430" r="7" fill="#ffffff" stroke="#b5c9c0" stroke-dasharray="3 2"/>
  <text x="442" y="436" fill="#3d5d53" font-family="Arial, Helvetica, sans-serif" font-size="16">Planned</text>
</svg>
